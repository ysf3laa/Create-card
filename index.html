<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صانع البطاقات التفاعلية</title>
<style>
:root{--primary:#ff4757;--secondary:#2f3542;--card-bg:#fff}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:linear-gradient(135deg,#a8c0ff 0%,#3f2b96 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.container{background:var(--card-bg);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:500px;overflow:hidden}
.header{background:var(--primary);color:#fff;padding:20px;text-align:center;font-size:1.2rem;font-weight:bold}
.content{padding:25px}
.form-group{margin-bottom:15px}
label{display:block;margin-bottom:5px;font-weight:600;color:var(--secondary);font-size:.9rem}
input,textarea,select{width:100%;padding:12px;border:2px solid #dfe4ea;border-radius:12px;font-size:1rem}
input:focus,textarea:focus,select:focus{border-color:var(--primary);outline:none}
textarea{resize:vertical;min-height:100px}
.btn{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:12px;font-size:1.1rem;font-weight:bold;cursor:pointer;margin-top:10px}
.btn:disabled{background:#ccc;cursor:not-allowed}
.btn-secondary{background:#747d8c}
.hidden{display:none!important}
.pin-screen{text-align:center;padding:40px 20px}
.pin-dots{display:flex;justify-content:center;gap:15px;margin:30px 0}
.pin-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--primary)}
.pin-dot.filled{background:var(--primary)}
.pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;max-width:300px;margin:0 auto}
.pin-btn{padding:20px;font-size:1.5rem;border:1px solid #dfe4ea;border-radius:50%;background:#fff;cursor:pointer}
.pin-btn:active{background:var(--primary);color:#fff}
.template-envelope{perspective:1000px;height:400px;display:flex;justify-content:center;align-items:center;cursor:pointer}
.envelope{width:300px;height:200px;background:#ff6b81;position:relative;transform-style:preserve-3d;transition:transform 1s;border-radius:10px}
.envelope.open{transform:rotateX(180deg)}
.envelope-flap{position:absolute;top:0;left:0;width:0;height:0;border-left:150px solid transparent;border-right:150px solid transparent;border-top:100px solid #ff4757;transform-origin:top;transition:transform .6s .4s;z-index:2}
.envelope.open .envelope-flap{transform:rotateX(180deg);z-index:0}
.envelope-body{position:absolute;bottom:0;width:100%;height:100%;background:#ff6b81;border-radius:10px;z-index:1;display:flex;justify-content:center;align-items:center;color:#fff;font-size:3rem}
.letter-paper{position:absolute;top:10px;left:10px;right:10px;bottom:10px;background:#fff;border-radius:5px;z-index:1;transition:transform .8s .8s;padding:20px;overflow-y:auto;color:#333;text-align:right}
.envelope.open .letter-paper{transform:translateY(-120px);z-index:3;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.template-musicbox{text-align:center;padding:20px}
.vinyl{width:150px;height:150px;background:repeating-radial-gradient(#111 0,#111 10px,#333 11px,#333 12px);border-radius:50%;margin:0 auto 20px;display:flex;justify-content:center;align-items:center;animation:spin 4s linear infinite;border:4px solid var(--primary)}
.vinyl.paused{animation-play-state:paused}
.vinyl-center{width:50px;height:50px;background:var(--primary);border-radius:50%}
@keyframes spin{100%{transform:rotate(360deg)}}
.template-polaroid{position:relative;height:400px}
.polaroid{position:absolute;background:#fff;padding:10px 10px 30px;box-shadow:0 4px 15px rgba(0,0,0,.2);width:200px;transition:transform .5s;cursor:pointer}
.polaroid img{width:100%;height:150px;object-fit:cover;background:#eee}
.polaroid p{text-align:center;margin-top:10px;font-family:'Courier New',monospace;font-size:.9rem;color:#333}
.polaroid:nth-child(1){transform:rotate(-5deg) translate(20px,20px);z-index:3}
.polaroid:nth-child(2){transform:rotate(3deg) translate(60px,60px);z-index:2}
.polaroid:nth-child(3){transform:rotate(-2deg) translate(100px,100px);z-index:1}
.polaroid:hover{transform:scale(1.1) rotate(0)!important;z-index:10!important}
.media-preview{max-width:100%;border-radius:10px;margin-top:10px;display:none}
.status-msg{font-size:.85rem;color:#747d8c;margin-top:5px;text-align:center}
.share-box{background:#f1f2f6;padding:15px;border-radius:10px;word-break:break-all;font-size:.9rem;margin-top:15px;border:2px dashed var(--primary)}
.loader{border:4px solid #f3f3f3;border-top:4px solid var(--primary);border-radius:50%;width:30px;height:30px;animation:spin 1s linear infinite;margin:20px auto;display:none}
</style>
</head>
<body>
<div class="container">
<div class="header" id="headerTitle">✨ صانع البطاقات التفاعلية</div>

<div class="content" id="creatorScreen">
  <div class="form-group"><label>اختر القالب التفاعلي</label>
    <select id="templateSelect">
      <option value="envelope">💌 ظرف حب ثلاثي الأبعاد (3D)</option>
      <option value="musicbox">🎵 صندوق الموسيقى (مع يوتيوب)</option>
      <option value="polaroid">📸 معرض ذكريات بولارويد</option>
    </select></div>
  <div class="form-group"><label>اسم المُهدى إليه</label><input type="text" id="inputName" placeholder="مثال: إلى أغلى الناس"></div>
  <div class="form-group"><label>رسالتك الخاصة</label><textarea id="inputMessage" placeholder="اكتب أجمل كلماتك هنا..."></textarea></div>
  <div class="form-group"><label>صورة (اختياري — تُضغط وتُحفظ مجاناً)</label><input type="file" id="inputImage" accept="image/*"><img id="imagePreview" class="media-preview"><div class="status-msg" id="imgStatus"></div></div>
  <div class="form-group hidden" id="youtubeGroup"><label>رابط موسيقى يوتيوب (اختياري)</label><input type="text" id="inputYoutube" placeholder="https://www.youtube.com/watch?v=..."></div>
  <div class="form-group"><label>رمز PIN (اختياري، 4 أرقام)</label><input type="password" id="inputPin" maxlength="4" placeholder="اتركه فارغاً إذا لم ترد قفلاً"></div>
  <button class="btn" id="generateBtn" onclick="generateCard()">🚀 إنشاء ومشاركة البطاقة</button>
  <div class="loader" id="loader"></div>
  <div class="status-msg" id="statusMsg"></div>
</div>

<div class="content hidden" id="shareScreen">
  <h3 style="text-align:center;color:var(--primary);margin-bottom:15px">🎉 تم إنشاء بطاقتك بنجاح!</h3>
  <p style="text-align:center;margin-bottom:15px">انسخ الرابط وأرسله للشخص المميز:</p>
  <div class="share-box" id="shareLink"></div>
  <button class="btn" onclick="copyLink()">📋 نسخ الرابط</button>
  <button class="btn btn-secondary" onclick="location.reload()">➕ إنشاء بطاقة جديدة</button>
</div>

<div class="pin-screen hidden" id="pinScreen">
  <h2>🔒 هذه البطاقة محمية</h2><p>أدخل رمز PIN المكون من 4 أرقام</p>
  <div class="pin-dots" id="pinDots"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div>
  <div class="pin-keypad">
    <button class="pin-btn" onclick="enterPin(1)">1</button><button class="pin-btn" onclick="enterPin(2)">2</button><button class="pin-btn" onclick="enterPin(3)">3</button>
    <button class="pin-btn" onclick="enterPin(4)">4</button><button class="pin-btn" onclick="enterPin(5)">5</button><button class="pin-btn" onclick="enterPin(6)">6</button>
    <button class="pin-btn" onclick="enterPin(7)">7</button><button class="pin-btn" onclick="enterPin(8)">8</button><button class="pin-btn" onclick="enterPin(9)">9</button>
    <button class="pin-btn" onclick="clearPin()">C</button><button class="pin-btn" onclick="enterPin(0)">0</button><button class="pin-btn" onclick="backspacePin()">⌫</button>
  </div>
  <p id="pinError" style="color:red;margin-top:15px;display:none">رمز PIN غير صحيح</p>
</div>

<div class="content hidden" id="viewerScreen" style="padding:0;background:#f8f9fa;min-height:500px">
  <div id="viewerContent"></div>
  <div style="text-align:center;padding:20px"><button class="btn" onclick="location.href=location.pathname" style="max-width:300px">✨ اصنع بطاقتك الخاصة مجاناً</button></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getFirestore, collection, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyClMLZwXm2sHhVA6QIF_Qq_r6wMkWoZMoc",
  authDomain: "birthday-card-ede5c.firebaseapp.com",
  projectId: "birthday-card-ede5c",
  storageBucket: "birthday-card-ede5c.firebasestorage.app",
  messagingSenderId: "183579389817",
  appId: "1:183579389817:web:afb7f82b6c70a1ed1149a8",
  measurementId: "G-13G48CSRWV"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.cardData = {};
window.pendingImage = "";
window.currentPinInput = "";
window.correctPin = "";

window.onload = async () => {
  const cardId = new URLSearchParams(window.location.search).get('id');
  if (cardId) {
    try {
      const snap = await getDoc(doc(db, "cards", cardId));
      if (snap.exists()) {
        window.cardData = snap.data();
        window.correctPin = window.cardData.pin || '';
        window.correctPin ? showScreen('pinScreen') : showCard();
      } else { alert('البطاقة غير موجودة أو تم حذفها.'); location.href = location.pathname; }
    } catch (e) { console.error(e); alert('خطأ في تحميل البطاقة. تأكد من تفعيل Firestore.'); location.href = location.pathname; }
  }
  document.getElementById('templateSelect').addEventListener('change', e =>
    document.getElementById('youtubeGroup').classList.toggle('hidden', e.target.value !== 'musicbox'));
  document.getElementById('inputImage').addEventListener('change', handleImageSelect);
};

// ضغط الصورة وحفظها كـ Base64 داخل Firestore (بديل Storage المجاني)
function compressImage(file, maxBytes = 800 * 1024) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const draw = (maxDim, q) => {
          const s = Math.min(1, maxDim / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          return c.toDataURL('image/jpeg', q);
        };
        let dim = 1000, q = 0.72, url = draw(dim, q);
        while (url.length > maxBytes && q > 0.35) { q -= 0.12; url = draw(dim, q); }
        while (url.length > maxBytes && dim > 320) { dim = Math.round(dim * 0.75); url = draw(dim, q); }
        resolve(url);
      };
      img.onerror = () => reject(new Error('تعذر قراءة الصورة'));
      img.src = ev.target.result;
    };
    reader.onerror = () => reject(new Error('تعذر قراءة الملف'));
    reader.readAsDataURL(file);
  });
}

async function handleImageSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('imgStatus').innerText = '⏳ جاري ضغط الصورة...';
  try {
    window.pendingImage = await compressImage(file);
    document.getElementById('imagePreview').src = window.pendingImage;
    document.getElementById('imagePreview').style.display = 'block';
    document.getElementById('imgStatus').innerText = '✅ تم ضغط الصورة (' + Math.round(window.pendingImage.length / 1024) + ' KB)';
  } catch (err) { document.getElementById('imgStatus').innerText = '❌ ' + err.message; }
}
window.handleImageSelect = handleImageSelect;

window.generateCard = async () => {
  const payload = {
    name: document.getElementById('inputName').value.trim(),
    message: document.getElementById('inputMessage').value.trim(),
    template: document.getElementById('templateSelect').value,
    youtube: document.getElementById('inputYoutube').value.trim(),
    pin: document.getElementById('inputPin').value.trim(),
    image: window.pendingImage,
    createdAt: new Date().toISOString()
  };
  if (!payload.name || !payload.message) { alert('يرجى إدخال الاسم والرسالة على الأقل.'); return; }
  if (JSON.stringify(payload).length > 950000) { alert('حجم البيانات كبير جداً على قاعدة البيانات المجانية، استخدم صورة أصغر.'); return; }

  const btn = document.getElementById('generateBtn'), loader = document.getElementById('loader'), status = document.getElementById('statusMsg');
  btn.disabled = true; loader.style.display = 'block'; status.innerText = 'جاري حفظ البطاقة...';
  try {
    const ref = await addDoc(collection(db, "cards"), payload);
    document.getElementById('shareLink').innerText = `${location.origin}${location.pathname}?id=${ref.id}`;
    loader.style.display = 'none'; btn.disabled = false; showScreen('shareScreen');
  } catch (e) {
    console.error(e);
    alert('خطأ: ' + e.message + '\n\nتأكد من تفعيل Firestore Database بوضع Test mode');
    loader.style.display = 'none'; btn.disabled = false; status.innerText = '';
  }
};

window.showCard = () => {
  showScreen('viewerScreen');
  const d = window.cardData;
  let html = `<h2 style="text-align:center;color:var(--primary);padding:20px 0">إلى: ${esc(d.name)} ❤️</h2>`;
  if (d.template === 'envelope') {
    html += `<div class="template-envelope" onclick="this.querySelector('.envelope').classList.toggle('open')"><div class="envelope"><div class="envelope-flap"></div><div class="envelope-body">💌<br><small style="font-size:14px">اضغط للفتح</small></div><div class="letter-paper"><p style="white-space:pre-wrap;line-height:1.8">${esc(d.message)}</p>${d.image ? `<img src="${d.image}" style="max-width:100%;border-radius:8px;margin-top:10px">` : ''}</div></div></div>`;
  } else if (d.template === 'musicbox') {
    const yt = ytId(d.youtube);
    html += `<div class="template-musicbox"><div class="vinyl paused" id="vinyl" onclick="toggleMusic('${yt}')"><div class="vinyl-center"></div></div><p style="margin-bottom:20px;color:#666">اضغط على القرص للتشغيل</p><div style="background:#fff;padding:20px;border-radius:15px;margin:0 20px;box-shadow:0 5px 15px rgba(0,0,0,.1)"><p style="white-space:pre-wrap;line-height:1.8">${esc(d.message)}</p>${d.image ? `<img src="${d.image}" style="max-width:100%;border-radius:8px;margin-top:15px">` : ''}</div>${yt ? '<div id="ytPlayerContainer" style="margin-top:20px"></div>' : ''}</div>`;
  } else {
    html += `<div class="template-polaroid">`;
    const parts = d.message.split('\n').filter(m => m.trim());
    const p = parts.length >= 3 ? parts : [d.message, 'أحبك', 'إلى الأبد'];
    for (let i = 0; i < 3; i++) html += `<div class="polaroid" style="top:${20 + i * 30}px;left:${20 + i * 10}px">${d.image ? `<img src="${d.image}">` : '<div style="width:100%;height:150px;background:#ddd;display:flex;align-items:center;justify-content:center;color:#999">صورة</div>'}<p>${esc(p[i] || 'ذكرى جميلة')}</p></div>`;
    html += `</div>`;
  }
  document.getElementById('viewerContent').innerHTML = html;
};

window.toggleMusic = yt => {
  const v = document.getElementById('vinyl'), c = document.getElementById('ytPlayerContainer');
  if (v.classList.contains('paused')) { v.classList.remove('paused'); if (yt && !c.innerHTML) c.innerHTML = `<iframe width="100%" height="200" src="https://www.youtube.com/embed/${yt}?autoplay=1&loop=1&playlist=${yt}" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`; }
  else { v.classList.add('paused'); c.innerHTML = ''; }
};

function ytId(url) { if (!url) return ''; const m = url.match(/^.*(youtu.be\/|v\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/); return (m && m[2].length === 11) ? m[2] : ''; }
function esc(t) { const d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; }

window.showScreen = id => {
  ['creatorScreen','shareScreen','pinScreen','viewerScreen'].forEach(x => document.getElementById(x).classList.add('hidden'));
  if (id === 'loader') { document.getElementById('creatorScreen').classList.remove('hidden'); document.getElementById('loader').style.display = 'block'; return; }
  document.getElementById(id).classList.remove('hidden');
  document.getElementById('headerTitle').innerText = id === 'viewerScreen' ? '🎁 بطاقة خاصة لك' : '✨ صانع البطاقات التفاعلية';
};

window.copyLink = () => navigator.clipboard.writeText(document.getElementById('shareLink').innerText).then(() => alert('✅ تم نسخ الرابط!'));

window.enterPin = n => { if (window.currentPinInput.length < 4) { window.currentPinInput += n; dots(); if (window.currentPinInput.length === 4) setTimeout(check, 300); } };
window.backspacePin = () => { window.currentPinInput = window.currentPinInput.slice(0, -1); dots(); document.getElementById('pinError').style.display = 'none'; };
window.clearPin = () => { window.currentPinInput = ''; dots(); document.getElementById('pinError').style.display = 'none'; };
function dots() { document.querySelectorAll('.pin-dot').forEach((d, i) => d.classList.toggle('filled', i < window.currentPinInput.length)); }
function check() { if (window.currentPinInput === window.correctPin) showCard(); else { document.getElementById('pinError').style.display = 'block'; window.currentPinInput = ''; dots(); } }
</script>
</body>
</html>
